services:
  server:
    build: .
    ports:
      - "8080:8080"
    environment:
      - DB_URI=${DOCKER_DB_URI}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:alpine
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASS}
    healthcheck:
      test: ["CMD", "pg_isready"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s